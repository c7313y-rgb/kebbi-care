  --f-disp:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

  --accent:#55B6D6; --accent-ink:#06212B; --accent-soft:#163742;
  --pre:#7D8A93; --post:#55B6D6; --oss:#E09A63;
  --good:#5FC690; --good-soft:#163527; --warn:#E3B24C; --warn-soft:#3A2E12; --bad:#F2877E; --bad-soft:#3E1D1A; color-scheme:dark}

input[type=text],input[type=number],input[type=date],select,textarea{font:1.05rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:48px;padding:8px 12px;width:100%;max-width:100%}
textarea{min-height:80px}
.seg{display:flex;flex-wrap:wrap;gap:8px}

.step button:first-child{border-radius:10px 0 0 10px}
.step button:last-child{border-radius:0 10px 10px 0}
.step input{border-radius:0;text-align:center;font-size:1.25rem;font-variant-numeric:tabular-nums;border-left:0;border-right:0}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px 20px}
.watch{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.watch .t{font-family:var(--f-disp);font-size:1.9rem;font-variant-numeric:tabular-nums;min-width:5ch}
.formtype{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.formtype button{text-align:left;display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:12px 14px}
.formtype button span{font-weight:400;font-size:.84rem;color:var(--muted)}
.formtype button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.sus{display:flex;flex-direction:column;gap:12px}
.sus .q{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.scale-lab{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);max-width:330px}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.steps .when{grid-row:span 2;font-family:var(--f-disp);font-weight:700;color:var(--accent);white-space:nowrap;font-size:.95rem;padding-top:2px}
.steps ul{margin:4px 0 0;padding-left:1.2em}
.calc{font-variant-numeric:tabular-nums;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.93rem;line-height:1.9}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{font-family:var(--f-body)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.mono{font-variant-numeric:tabular-nums}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.93rem}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<header class="top"><div class="wrap">

<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLS=['handover','receive','ai','survey','kebbi'];
const DEFAULTS={device:'',lastExport:'',sites:['ゆるり・あ鶴舞','KODOU','ほたる'],residentsDefault:20,perDay:2,receiversPerDay:null,wage:null,annualHours:null,
  preStart:'2026-10-26',preEnd:'2026-10-30',postStart:'2026-10-31',postEnd:'2026-11-20'};
const MODELS=['東大MedLLM','gpt-oss-120b'];
const MODEL_FULL={'東大MedLLM':'Weblab-MedLLM-gpt-oss-120b（東京大学・国産）','gpt-oss-120b':'gpt-oss-120b（OpenAI・比較対照）'};
const ERR_TYPES=['利用者の取り違え','同姓・呼び名の判別不可','略語・単位の誤変換','数値・時刻の誤り','否定の取り違え','根拠のない追加','重要事項の抜け落ち','7項目の分類誤り','医療・介護用語の誤り','やさしい日本語化の不自然さ','音声認識の誤り（モデル外）'];
const BURDEN=['申し送りに時間がかかると感じる','必要な情報を探したり聞き直したりする手間が大きい','伝え漏れ・聞き漏れが不安だ','申し送りのために直接ケアの時間が削られている'];
const SUS=['このしくみを今後もよく使いたい','このしくみは必要以上に複雑だ','このしくみは使いやすい','使うには詳しい人の助けが必要だ','機能がよくまとまっている','ちぐはぐで一貫性のないところが多い','たいていの人はすぐ使い方を覚えられる','とても扱いにくい','自信をもって使えた','使い始める前に覚えることが多かった'];
const RECV_ROLES=['遅出スタッフ','ヘルプ看護師','外国人職員','その他'];
const STAFF_ROLES=['記録担当','確定担当','遅出スタッフ','ヘルプ看護師','外国人職員','その他'];
const N_MIN={handover:10,receive:10,ai:30,survey:8};

const S={mode:'loading',uid:null,data:{},settings:{...DEFAULTS},tab:'input',form:'handover',site:'',watch:{}};
COLS.forEach(c=>S.data[c]=[]);
let db=null,dl=null;

/* ---------- 汎用 ---------- */
const median=a=>{const b=a.filter(v=>v!=null&&isFinite(v)).sort((x,y)=>x-y);if(!b.length)return null;const m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2};
const pctile=(a,p)=>{const b=a.filter(v=>v!=null&&isFinite(v)).sort((x,y)=>x-y);if(!b.length)return null;const i=Math.min(b.length-1,Math.ceil(p*b.length)-1);return b[Math.max(0,i)]};
const mean=a=>{const b=a.filter(v=>v!=null&&isFinite(v));return b.length?b.reduce((x,y)=>x+y,0)/b.length:null};
const sum=(a,f)=>a.reduce((x,r)=>x+(+f(r)||0),0);
const ratio=(a,b)=>b?a/b:null;
const f1=v=>v==null||!isFinite(v)?'—':(Math.round(v*10)/10).toLocaleString('ja-JP',{minimumFractionDigits:1,maximumFractionDigits:1});
const f0=v=>v==null||!isFinite(v)?'—':Math.round(v).toLocaleString('ja-JP');
const fp=v=>v==null||!isFinite(v)?'—':(v*100).toFixed(1)+'%';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const num=v=>{if(v==null||v==='')return null;const n=Number(String(v).replace(/[,\s]/g,''));return isFinite(n)?n:null};
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
async function copyText(text,ok){try{await navigator.clipboard.writeText(text);toast(ok)}catch(e){showCopyBox(text)}}
function showCopyBox(text){const box=$('copyBox');if(box){box.hidden=false;box.value=text;box.focus();box.select();toast('自動コピーできませんでした。選択された文字をコピーしてください')}}
const rid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---------- 保存先 ---------- */
const LS='kebbi-kpi-local-v1';
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j){COLS.forEach(c=>S.data[c]=j.data?.[c]||[]);if(j.settings)S.settings={...DEFAULTS,...j.settings}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({data:S.data,settings:S.settings}))}catch(e){}publishExport()}
function publishExport(){try{localStorage.setItem('kebbi-kpi-export-v1',JSON.stringify({at:new Date().toISOString(),device:devLabel(),csv:toCSV(flatRows(S.data))}))}catch(e){}}
function ensureDevice(){if(!S.settings.devCode){S.settings.devCode='D'+Math.random().toString(36).slice(2,6).toUpperCase();saveLocal()}}
const devLabel=()=>S.settings.device||S.settings.devCode||'';
function unexported(){const t=S.settings.lastExport||'';return COLS.reduce((n,c)=>n+S.data[c].filter(r=>String(r.at||'')>t).length,0)}
function markExported(){S.settings.lastExport=new Date().toISOString();saveLocal()}
async function initStore(){
  let user=null;
  try{if(window.claude?.use){[db,user,dl]=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')])}}catch(e){db=null}
  try{if(user)S.uid=await user.id()}catch(e){}
  if(db){S.mode='db';
    COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{S.data[c]=snap.docs.map(d=>({...d.data(),id:d.id}));scheduleRender()},e=>{toast('データの受信が止まりました。ページを開き直してください')}));
    db.doc('config/settings').onSnapshot(snap=>{if(snap.exists){S.settings={...DEFAULTS,...snap.data()}}scheduleRender()},()=>{});
  }else{S.mode='local';loadLocal();ensureDevice();publishExport();try{navigator.storage?.persist?.()}catch(e){}}
  scheduleRender(true)}
let rq=null;function scheduleRender(force){if(rq)return;rq=requestAnimationFrame(()=>{rq=null;if(force||S.tab!=='input'||!document.activeElement||document.activeElement===document.body)render();else renderHeadOnly()})}
async function addRec(col,obj,id,keepAt){obj={...obj,at:keepAt&&obj.at?obj.at:new Date().toISOString(),by:S.uid||'',dev:obj.dev||devLabel()};
  if(S.mode==='db'){try{const ref=id?db.collection(col).doc(id):db.collection(col).doc();await ref.set(obj);return true}catch(e){toast(e.code==='quota_exceeded'?'保存容量の上限です。古い取込データを削除してください':'保存できませんでした（'+(e.code||'エラー')+'）。編集権限があるか確認してください');return false}}
  obj.id=id||(S.settings.devCode+'-'+rid());S.data[col].push(obj);saveLocal();scheduleRender(true);return true}
async function delRec(col,id){if(S.mode==='db'){try{await db.collection(col).doc(id).delete()}catch(e){toast('削除できませんでした')}}else{S.data[col]=S.data[col].filter(r=>r.id!==id);saveLocal();render()}}
async function saveSettings(s){S.settings={...S.settings,...s};if(S.mode==='db'){try{await db.doc('config/settings').set(S.settings);toast('設定を保存しました')}catch(e){toast('設定を保存できませんでした。編集権限を確認してください')}}else{saveLocal();toast('設定を保存しました')}render()}

/* ---------- 例のデータ（記録が1件もないときだけ表示） ---------- */
function sampleData(){let seed=7;const r=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};const g=(m,s)=>m+s*((r()+r()+r()-1.5)/0.75);
  const sites=S.settings.sites.slice(0,3),d={handover:[],receive:[],ai:[],survey:[],kebbi:[]};const day=(base,i)=>{const t=new Date(base+'T00:00:00');t.setDate(t.getDate()+i);return t.toISOString().slice(0,10)};
  sites.forEach((site,si)=>{
    for(let i=0;i<5;i++)for(const slot of['朝7時','夜20時']){const res=Math.round(g(12,2));d.handover.push({phase:'pre',site,date:day(S.settings.preStart,i),slot,method:'従来',minutes:+Math.max(8,g(19,3.5)).toFixed(1),residents:res,staff:3,reasks:Math.round(Math.max(0,g(3,1.4))),keyTotal:Math.round(g(6,1.5)),keyMissed:Math.round(Math.max(0,g(1.1,.8)))})}
    for(let i=0;i<21;i+=2)for(const slot of['朝7時','夜20時']){const res=Math.round(g(12,2));d.handover.push({phase:'post',site,date:day(S.settings.postStart,i),slot,method:'Kebbi',minutes:+Math.max(6,g(13.5+(i<6?2:0),2.8)).toFixed(1),residents:res,staff:3,reasks:Math.round(Math.max(0,g(1.1,.9))),keyTotal:Math.round(g(6,1.5)),keyMissed:Math.round(Math.max(0,g(.4,.5)))})}
    for(let i=0;i<5;i++)for(const role of['遅出スタッフ','ヘルプ看護師','外国人職員'])d.receive.push({phase:'pre',site,date:day(S.settings.preStart,i),role,findMinutes:+Math.max(2,g(9,2.5)).toFixed(1),searches:Math.round(Math.max(0,g(2.2,1))),qTotal:3,qCorrect:Math.min(3,Math.round(g(role==='外国人職員'?1.6:2.1,.6)))});
    for(let i=0;i<21;i+=2)for(const role of['遅出スタッフ','ヘルプ看護師','外国人職員'])d.receive.push({phase:'post',site,date:day(S.settings.postStart,i),role,findMinutes:+Math.max(1,g(4.2,1.6)).toFixed(1),searches:Math.round(Math.max(0,g(.5,.6))),qTotal:3,qCorrect:Math.min(3,Math.round(g(role==='外国人職員'?2.4:2.6,.4)))});
    for(let k=0;k<4;k++)d.survey.push({phase:'pre',site,role:STAFF_ROLES[k],burden:BURDEN.map(()=>Math.min(5,Math.max(1,Math.round(g(3.9,.7)))))});
    for(let k=0;k<4;k++){const sus=SUS.map((_,j)=>Math.min(5,Math.max(1,Math.round(j%2?g(2,.7):g(4,.7)))));d.survey.push({phase:'post',site,role:STAFF_ROLES[k],burden:BURDEN.map(()=>Math.min(5,Math.max(1,Math.round(g(2.7,.7))))),sus})}
    for(let i=0;i<12;i++)for(const model of MODELS){const tok=model===MODELS[0];const idT=Math.round(g(5,1.5));const sent=Math.round(g(8,2));
      d.ai.push({date:day(S.settings.postStart,i),site,model,recId:`H${si+1}${String(i).padStart(3,'0')}`,idTotal:idT,idCorrect:Math.max(0,idT-(r()<(tok?.18:.25)?1:0)),tagTP:Math.round(g(6,1.2)),tagFP:r()<(tok?.25:.35)?1:0,tagFN:r()<(tok?.3:.35)?1:0,sentTotal:sent,errFact:r()<(tok?.12:.22)?1:0,errAdded:r()<(tok?.08:.15)?1:0,errMissing:r()<.15?1:0,editTried:1,editOk:r()<(tok?.85:.8)?1:0,termTotal:2,termCorrect:r()<(tok?.85:.7)?2:1,latencySec:+g(tok?9:7,2).toFixed(1),errorTypes:r()<.3?[ERR_TYPES[Math.floor(r()*ERR_TYPES.length)]]:[]})}

/* ---------- 計算 ---------- */
function filt(rows){return S.site?rows.filter(r=>r.site===S.site):rows}
function kebbiDays(data,all){const map=new Map();const imps=[...data.kebbi].sort((a,b)=>String(a.importedAt).localeCompare(String(b.importedAt)));
  for(const im of imps)for(const p of im.perDay||[])map.set(p.site+'|'+p.date,p);
  return[...map.values()].filter(p=>all||!S.site||p.site===S.site)}
function compute(data){const st=S.settings;const out={};
  const ho={pre:filt(data.handover.filter(r=>r.phase==='pre')),post:filt(data.handover.filter(r=>r.phase==='post'))};
  const rc={pre:filt(data.receive.filter(r=>r.phase==='pre')),post:filt(data.receive.filter(r=>r.phase==='post'))};
  const sv={pre:filt(data.survey.filter(r=>r.phase==='pre')),post:filt(data.survey.filter(r=>r.phase==='post'))};
  for(const p of['pre','post']){const h=ho[p],c=rc[p],s=sv[p];
    out[p]={nHo:h.length,min:median(h.map(r=>r.minutes)),minMean:mean(h.map(r=>r.minutes)),perRes:median(h.map(r=>r.residents?r.minutes*60/r.residents:null)),
      reasks:mean(h.map(r=>r.reasks)),leak:ratio(sum(h,r=>r.keyMissed),sum(h,r=>r.keyTotal)),keyN:sum(h,r=>r.keyTotal),
      nRc:c.length,find:median(c.map(r=>r.findMinutes)),searches:mean(c.map(r=>r.searches)),grasp:ratio(sum(c,r=>r.qCorrect),sum(c,r=>r.qTotal)),qN:sum(c,r=>r.qTotal),
      graspF:ratio(sum(c.filter(r=>r.role==='外国人職員'),r=>r.qCorrect),sum(c.filter(r=>r.role==='外国人職員'),r=>r.qTotal)),nF:c.filter(r=>r.role==='外国人職員').length,
      graspO:ratio(sum(c.filter(r=>r.role!=='外国人職員'),r=>r.qCorrect),sum(c.filter(r=>r.role!=='外国人職員'),r=>r.qTotal)),nO:c.filter(r=>r.role!=='外国人職員').length,
      nSv:s.length,burden:mean(s.map(r=>mean(r.burden||[]))),
      sus:mean(s.filter(r=>Array.isArray(r.sus)&&r.sus.length===10).map(r=>susScore(r.sus))),nSus:s.filter(r=>Array.isArray(r.sus)&&r.sus.length===10).length,
      minutes:h.map(r=>r.minutes)}}
  out.ai={};const ai=filt(data.ai);
  for(const m of MODELS){const a=ai.filter(r=>r.model===m);const tp=sum(a,r=>r.tagTP),fpv=sum(a,r=>r.tagFP),fn=sum(a,r=>r.tagFN);const pr=ratio(tp,tp+fpv),re=ratio(tp,tp+fn);
    const types={};a.forEach(r=>(r.errorTypes||[]).forEach(t=>types[t]=(types[t]||0)+1));
    out.ai[m]={n:a.length,idAcc:ratio(sum(a,r=>r.idCorrect),sum(a,r=>r.idTotal)),termAcc:ratio(sum(a,r=>r.termCorrect),sum(a,r=>r.termTotal)),precision:pr,recall:re,f1:(2*tp+fpv+fn)>0?2*tp/(2*tp+fpv+fn):null,
      errRate:ratio(sum(a,r=>(+r.errFact||0)+(+r.errAdded||0)+(+r.errMissing||0)),sum(a,r=>r.sentTotal)),addRate:ratio(sum(a,r=>r.errAdded),sum(a,r=>r.sentTotal)),
      clean:ratio(a.filter(r=>!(+r.errFact||+r.errAdded||+r.errMissing)).length,a.length),
      editRate:ratio(sum(a,r=>r.editOk),sum(a,r=>r.editTried)),lat:median(a.map(r=>r.latencySec)),lat90:pctile(a.map(r=>r.latencySec),.9),types}}
  const kd=kebbiDays(data);const totalDays=daysBetween(st.postStart,st.postEnd);const usedDates=new Set(kd.filter(p=>p.n>0).map(p=>p.date));
  const n=sum(kd,p=>p.n);
  out.kebbi={days:kd,usedDays:usedDates.size,totalDays,n,perDay:totalDays?n/totalDays/(S.site?1:Math.max(1,new Set(kd.map(p=>p.site)).size)):null,
    staff:S.site?null:Math.max(0,...data.kebbi.map(i=>i.staffTotal||0)),corrRate:ratio(sum(kd,p=>p.corr),n),autoRate:ratio(sum(kd,p=>p.auto),sum(kd,p=>p.rows)),
    recvRate:ratio(sum(kd,p=>p.recv),n),dur:ratio(sum(kd,p=>p.durSum),sum(kd,p=>p.durN)),lead:ratio(sum(kd,p=>p.leadSum),sum(kd,p=>p.leadN)),unid:ratio(sum(kd,p=>p.unid),sum(kd,p=>p.rows))};
  // 効果の換算
  const save=out.pre.min!=null&&out.post.min!=null?out.pre.min-out.post.min:null;const saveR=out.pre.find!=null&&out.post.find!=null?out.pre.find-out.post.find:null;
  const perDay=num(st.perDay),rpd=num(st.receiversPerDay),siteN=S.site?1:Math.max(1,st.sites.length);
  const daily=save!=null&&perDay?save*perDay+(saveR!=null&&rpd?saveR*rpd:0):null;
  const yearSite=daily!=null?daily*365/60:null;const yearAll=yearSite!=null?yearSite*siteN:null;
  out.impact={save,saveR,perDay,rpd,siteN,daily,yearSite,yearAll,cost:yearAll!=null&&num(st.wage)?yearAll*num(st.wage):null,fte:yearAll!=null&&num(st.annualHours)?yearAll/num(st.annualHours):null,
    rate:out.pre.min&&out.post.min!=null?(out.pre.min-out.post.min)/out.pre.min:null};
  return out}
function susScore(a){let s=0;a.forEach((v,i)=>{s+=i%2===0?(v-1):(5-v)});return s*2.5}
function daysBetween(a,b){if(!a||!b)return 0;return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)+1}
function isEmpty(){return COLS.every(c=>!S.data[c].length)}
function current(){return S.data}

/* ---------- 表示部品 ---------- */
function chg(pre,post,downGood){if(pre==null||post==null||!isFinite(pre)||!isFinite(post))return '<span class="chip mute">比較不可</span>';
  if(pre===0)return '<span class="chip mute">導入前0</span>';const p=(post-pre)/Math.abs(pre);const good=downGood?p<0:p>0;
  return `<span class="chip ${Math.abs(p)<.02?'mute':good?'good':'bad'}">${p>0?'+':''}${(p*100).toFixed(1)}%</span>`}
function nChip(n,min){return n>=min?`<span class="chip good">n=${n}</span>`:n?`<span class="chip warn" title="目安 ${min} 件以上">n=${n}・不足</span>`:'<span class="chip mute">未計測</span>'}
function stripChart(pre,post){const all=[...pre,...post].filter(v=>v!=null);if(!all.length)return '<p class="sub">申し送り時間の計測がまだありません。</p>';
  const W=640,H=170,L=88,R=24,max=Math.ceil(Math.max(...all)/5)*5||5,x=v=>L+(W-L-R)*v/max;
  const ticks=[];for(let t=0;t<=max;t+=5)ticks.push(t);
  const row=(vals,y,col,label)=>{const md=median(vals);let jit=0;return `<text x="${L-10}" y="${y+5}" text-anchor="end" font-size="13" fill="var(--ink)" font-weight="700">${label}</text>`+
    vals.map(v=>{jit=(jit+7)%21;return `<circle cx="${x(v).toFixed(1)}" cy="${(y-10+jit).toFixed(1)}" r="4.5" fill="${col}" fill-opacity=".55"/>`}).join('')+
    (md!=null?`<line x1="${x(md)}" x2="${x(md)}" y1="${y-18}" y2="${y+20}" stroke="${col}" stroke-width="3"/><text x="${x(md)}" y="${y-24}" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="700">中央値 ${f1(md)}分</text>`:'')};
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="申し送り1回の所要時間の分布">
    ${ticks.map(t=>`<line x1="${x(t)}" x2="${x(t)}" y1="20" y2="${H-26}" stroke="var(--line)"/><text x="${x(t)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${t}</text>`).join('')}
    <text x="${W-R}" y="${H-8}" text-anchor="end" font-size="12" fill="var(--muted)">分</text>
    ${row(pre,58,'var(--pre)','導入前')}${row(post,118,'var(--post)','Kebbi実証')}</svg></div>`}
function modelBars(ai){const mets=[['利用者識別の正解率','idAcc'],['登録用語の正しい表記','termAcc'],['7項目分類 F1','f1'],['誤りのない要約の割合','clean'],['部分訂正の成功率','editRate']];
  const W=640,rowH=54,H=mets.length*rowH+20,L=170,R=60,x=v=>L+(W-L-R)*v;
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="国産モデルと比較モデルの精度比較">
   ${[0,.25,.5,.75,1].map(t=>`<line x1="${x(t)}" x2="${x(t)}" y1="6" y2="${H-14}" stroke="var(--line)"/><text x="${x(t)}" y="${H}" text-anchor="middle" font-size="11" fill="var(--muted)">${t*100}%</text>`).join('')}
   ${mets.map(([lab,k],i)=>{const y=10+i*rowH;return `<text x="${L-10}" y="${y+24}" text-anchor="end" font-size="13" fill="var(--ink)">${lab}</text>`+
     MODELS.map((m,j)=>{const v=ai[m][k];const col=j?'var(--oss)':'var(--post)';return v==null?`<text x="${L+4}" y="${y+14+j*20}" font-size="11" fill="var(--muted)">データなし</text>`:
       `<rect x="${L}" y="${y+4+j*20}" width="${Math.max(1,x(v)-L).toFixed(1)}" height="16" rx="3" fill="${col}"/><text x="${(x(v)+6).toFixed(1)}" y="${y+17+j*20}" font-size="12" fill="var(--ink)" class="mono">${fp(v)}</text>`}).join('')}).join('')}
  </svg></div><div class="legend"><span><i style="background:var(--post)"></i>${MODEL_FULL[MODELS[0]]}</span><span><i style="background:var(--oss)"></i>${MODEL_FULL[MODELS[1]]}</span></div>`}
function usageChart(k){const st=S.settings;const n=daysBetween(st.postStart,st.postEnd);if(!n||n>120)return '';const by=new Map();k.days.forEach(p=>by.set(p.date,(by.get(p.date)||0)+(+p.n||0)));
  if(!by.size)return '<p class="sub">Kebbiの申し送りCSVを取り込むと、日ごとの利用回数が表示されます。</p>';
  const days=[];for(let i=0;i<n;i++){const d=new Date(st.postStart+'T00:00:00');d.setDate(d.getDate()+i);days.push(ymd(d))}
  const max=Math.max(2,...by.values()),W=640,H=170,L=34,R=10,T=14,B=30,bw=(W-L-R)/n;const y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,Math.round(max/2),max];
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="実証期間中の日別Kebbi利用回数">
   ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`).join('')}
   ${days.map((d,i)=>{const v=by.get(d)||0;const lab=i%3===0?`<text x="${L+bw*i+bw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${+d.slice(5,7)}/${+d.slice(8)}</text>`:'';
     return (v?`<rect x="${(L+bw*i+2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${(y(0)-y(v)).toFixed(1)}" rx="2" fill="var(--post)"/>`:`<rect x="${(L+bw*i+2).toFixed(1)}" y="${y(0)-3}" width="${(bw-4).toFixed(1)}" height="3" fill="var(--bad)"/>`)+lab}).join('')}

async function readFileText(f){const buf=await f.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('shift_jis').decode(buf)}}
const parseDT=v=>{const m=String(v||'').trim().match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);return m?new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0)):null};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
async function importFiles(files){const res=[];S.impMsg='取り込み中…';render();
  for(const f of files){const text=(await readFileText(f)).replace(/^﻿/,'');const r=Papa.parse(text,{header:true,skipEmptyLines:'greedy',transformHeader:h=>h.trim()});const fields=r.meta.fields||[];
    if(['計測種別','測定期','拠点'].every(c=>fields.includes(c))){res.push(await importMeasure(r.data,f.name));continue}
    if(['申し送りID','拠点','録音開始','確定日時','利用者ID'].every(c=>fields.includes(c))){res.push(await importKebbi(r.data,f.name));continue}
    res.push(`${f.name}：種類を判定できませんでした（健康チェック・看護師申し送り・マスタはデータ管理画面で取り込みます）`)}
  S.impMsg=res.join('　');render();toast('取り込みが終わりました')}
async function importKebbi(rows,name){const ho=new Map();const staffAll=new Set();
  for(const r of rows){const id=r['申し送りID']?r['拠点']+'|'+r['申し送りID']:'';if(!id)continue;if(!ho.has(id))ho.set(id,{site:r['拠点'],start:parseDT(r['録音開始']),fix:parseDT(r['確定日時']),by:r['申し送り者ID'],recv:parseDT(r['受け取り日時']),rows:[]});ho.get(id).rows.push(r);if(r['申し送り者ID'])staffAll.add(r['申し送り者ID'])}
  const day=new Map();for(const h of ho.values()){if(!h.start)continue;const key=h.site+'|'+ymd(h.start);if(!day.has(key))day.set(key,{site:h.site,date:ymd(h.start),n:0,rows:0,staffSet:new Set(),corr:0,auto:0,recv:0,durSum:0,durN:0,leadSum:0,leadN:0,unid:0});
    const d=day.get(key);d.n++;d.rows+=h.rows.length;if(h.by)d.staffSet.add(h.by);if(h.rows.some(x=>x['AI要約修正']==='修正あり'))d.corr++;
    h.rows.forEach(x=>{if(x['利用者識別']==='AI自動')d.auto++;if(x['利用者識別']==='未識別'||!x['利用者ID'])d.unid++});
    if(h.recv){d.recv++;if(h.fix){d.leadSum+=(h.recv-h.fix)/6e4;d.leadN++}}if(h.fix){d.durSum+=(h.fix-h.start)/6e4;d.durN++}}
  const perDay=[...day.values()].map(({staffSet,...d})=>({...d,staff:staffSet.size,durSum:+d.durSum.toFixed(2),leadSum:+d.leadSum.toFixed(2)}));
  const sites=new Set(perDay.map(p=>p.site));const unknown=[...sites].filter(s=>!S.settings.sites.includes(s));
  const ok=await addRec('kebbi',{fileName:name,importedAt:new Date().toISOString(),rows:rows.length,staffTotal:staffAll.size,perDay});
  return ok?`${name}：申し送り ${ho.size}回・${perDay.length}日分の集計を保存${unknown.length?`（設定にない拠点名：${unknown.join('、')}。設定の拠点名と揃えてください）`:''}`:`${name}：保存できませんでした`}
async function importMeasure(rows,name){const have=new Set(COLS.flatMap(c=>S.data[c].map(r=>r.id)));let n=0,skip=0;const map=Object.fromEntries(CSV_COLS.map(([j,k])=>[j,k]));
  let ex=0;for(const r of rows){const type=JA_TYPE[r['計測種別']];if(!type||type==='kebbi'){continue}if(/^EX\d+$/.test(String(r['レコードID']||''))){ex++;continue}const id=String(r['レコードID']||'').replace(/[^A-Za-z0-9_\-.~:@+]/g,'')||null;if(id&&have.has(id)){skip++;continue}
    const o={};for(const[j,k]of Object.entries(map)){if(k.startsWith('_')||k==='id')continue;const v=r[j];if(v==null||v==='')continue;o[k]=['site','date','slot','method','role','model','recId','memo','dev','at'].includes(k)?v:num(v)}
    if(type!=='ai')o.phase=r['測定期']==='導入前'?'pre':'post';
    if(type==='ai')o.errorTypes=String(r['誤り類型']||'').split('／').filter(Boolean);
    if(type==='survey'){o.burden=BURDEN.map((_,i)=>num(r['負担感'+(i+1)]));const s=SUS.map((_,i)=>num(r['SUS'+(i+1)]));if(s.every(x=>x!=null))o.sus=s}
    if(await addRec(type,o,id||undefined,true))n++}
  return `${name}：${n}件を追加${skip?`、${skip}件は登録済みのため省略`:''}${ex?`、例のデータ${ex}件は取り込みませんでした`:''}`}

  for(let i=0;i<rows.length;i++){const r=K.normalizeMeasure(rows[i]);if(/^EX\d+$/.test(r['レコードID']||'')){errors.push(`行${i+2}：架空例`);continue}const errs=K.validateMeasure(r);if(errs.length){errors.push(`行${i+2}：${errs.join('、')}`);continue}const type=JA_TYPE[r['計測種別']];let original={};try{if(r['原データJSON'])original=JSON.parse(r['原データJSON']);if(!original||typeof original!=='object'||Array.isArray(original))throw Error()}catch{errors.push(`行${i+2}：原データJSONが不正`);continue}
    if(type==='kebbi'){const p={...original,site:r['拠点'],date:r['日付'],n:num(r['日次_申し送り回数']),rows:num(r['日次_利用者記録数']),staff:num(r['日次_利用職員数']),corr:num(r['日次_AI要約修正回数']),auto:num(r['日次_自動識別数']),recv:num(r['日次_受け取り完了数']),durSum:num(r['日次_録音確定分合計']),durN:num(r['日次_録音確定件数']),leadSum:num(r['日次_確定受取分合計']),leadN:num(r['日次_確定受取件数']),unid:num(r['日次_未識別数'])};if(p.durN==null&&num(r['日次_録音確定平均分'])!=null){p.durN=p.n;p.durSum=num(r['日次_録音確定平均分'])*p.n}daily.push(p);continue}
    const o={...original,id:r['レコードID']};for(const[j,k]of CSV_COLS){if(k.startsWith('_')||k==='id')continue;o[k]=['site','date','slot','method','role','model','recId','memo','dev','at','observerRef','observerId','updatedAt'].includes(k)?r[j]||'':num(r[j])}if(type!=='ai')o.phase=r['測定期']==='導入前'?'pre':'post';if(type==='ai')o.errorTypes=String(r['誤り類型']||'').split('／').filter(Boolean);if(type==='survey'){o.burden=BURDEN.map((_,i)=>num(r['負担感'+(i+1)]));const s=SUS.map((_,i)=>num(r['SUS'+(i+1)]));if(s.every(v=>v!=null))o.sus=s;else delete o.sus}const old=have.get(o.id);if(old){const oldRow=flatRows(Object.fromEntries(COLS.map(c=>[c,c===old.c?[old.r]:[]])))[0];const oldJ=Object.fromEntries(CSV_COLS.filter(([j,k])=>k!=='_rawJSON').map(([j,k])=>[j,String(oldRow[k]??'')]));const newJ=Object.fromEntries(CSV_COLS.filter(([j,k])=>k!=='_rawJSON').map(([j])=>[j,String(r[j]??'')]));if(K.stable(oldJ)===K.stable(newJ))dup++;else errors.push(`行${i+2}：ID ${o.id} は既存内容と異なります（既存を保持）`);continue}next[type].push(o);have.set(o.id,{c:type,r:o});n++}
  if(daily.length){const existing=kebbiDays(next,true);const adds=daily.filter(p=>{const same=existing.find(x=>x.site===p.site&&x.date===p.date);if(same&&K.stable(same)===K.stable(p)){dup++;return false}if(same){errors.push(p.site+' '+p.date+'：日次集計が既存と異なります');return false}existing.push(p);return true});if(adds.length){next.kebbi.push({id:'daily-'+K.uuid(),fileName:name,importedAt:K.stamp(),perDay:adds});n+=adds.length}}
  const before=S.data;S.data=next;if(!saveLocal()){S.data=before;return name+'：保存失敗'}if(errors.length)K.download('取込できなかった行_'+today()+'.csv',K.csv(errors.map(reason=>({ファイル:name,理由:reason}))));return `${name}：追加${n}件／重複${dup}件／要確認${errors.length}件${errors.length?'（理由CSVを保存）':''}`};
importFiles=async function(files){const messages=[];for(const f of files){try{const r=await K.parseFile(f);if(r.rows&&r.fields.includes('計測種別'))messages.push(await importMeasure(r.rows,f.name));else if(r.rows&&['申し送りID','拠点','録音開始','確定日時','利用者ID'].every(c=>r.fields.includes(c)))messages.push(await importKebbi(r.rows,f.name));else messages.push(f.name+'：対応形式ではありません')}catch(e){messages.push(f.name+'：'+e.message)}}S.impMsg=messages.join('\n');render();toast('取り込み結果を確認してください')};
const oldImportKebbi=importKebbi;
importKebbi=async function(rows,name){const fields=['申し送りID','拠点','録音開始','確定日時','申し送り者ID','利用者ID','項目','利用者識別','AI要約修正','受け取り日時'];const prior=S.data.kebbi.find(x=>x.id==='kebbi-cumulative-v2');const union=new Map((prior?.sourceRows||[]).map(r=>[JSON.stringify([r['拠点'],r['申し送りID'],r['利用者ID'],r['項目']]),r]));let added=0;for(let i=0;i<rows.length;i++){const r=Object.fromEntries(fields.map(k=>[k,rows[i][k]||'']));const st=parseDT(r['録音開始']),fi=parseDT(r['確定日時']);if(!r['申し送りID']||!r['拠点']||!st||!fi||fi<st)return name+`：行${i+2}のID・拠点・日時が不正のため取込中止`;const key=JSON.stringify([r['拠点'],r['申し送りID'],r['利用者ID'],r['項目']]);const old=union.get(key);if(old&&K.stable(old)!==K.stable(r))return name+`：行${i+2}は取込済みの同一キーと内容が異なります。元データを確認してください`;if(!old){union.set(key,r);added++}}if(!added)return name+'：同一行はすべて取込済み';
  const previous=structuredClone(S.data.kebbi);const beforeIds=new Set(S.data.kebbi.map(r=>r.id));const message=await oldImportKebbi([...union.values()],name);const made=S.data.kebbi.find(r=>!beforeIds.has(r.id));if(!made)return message;made.id='kebbi-cumulative-v2';made.sourceRows=[...union.values()];S.data.kebbi=S.data.kebbi.filter(r=>r===made||r.id!=='kebbi-cumulative-v2');if(!saveLocal()){S.data.kebbi=previous;return name+'：保存失敗'}return name+`：新規${added}行を統合。累計${union.size}行から日次集計を更新`};
window.addEventListener('storage',e=>{if(e.key===LS){loadLocal();if(S.tab!=='input')render()}});
const oldBindSettings=bindSettings;
bindSettings=function(){oldBindSettings();const f=$('sf'),submit=f?.onsubmit;if(f)f.onsubmit=e=>{const a=$('sPs').value,b=$('sPe').value,c=$('sQs').value,d=$('sQe').value;if(![a,b,c,d].every(K.validDate)||a>b||c>d||b>=c){e.preventDefault();toast('期間を確認してください。導入前→実証の順で重ならない日付を指定します');return}submit(e)}};
const oldSaveSettings=saveSettings;
saveSettings=async function(settings){const before=S.settings;S.settings={...S.settings,...settings};if(!saveLocal()){S.settings=before;return}toast('設定を保存しました');render()};
const toolBar=document.createElement('div');toolBar.className='toolbar-wrap';toolBar.innerHTML='<div class="actions"><a href="datamgmt.html">管理画面を開く</a><span class="draft-note">①計測を入力 → ②保存 → ③CSV・レポート出力</span></div>';document.querySelector('main').before(toolBar);K.installMasterButton(toolBar.firstElementChild);

window.KebbiModule={showMaster:K.showMaster};
render();initStore();
})();
