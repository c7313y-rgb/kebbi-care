<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kebbi操作デモ｜Kebbi Care DB v3</title>
<style>
:root{--ink:#1d2b3a;--ink2:#3d4c5a;--mute:#6a7682;--line:#dfe3e6;--bg:#eef1ee;--teal:#1f7a72;--teal-bg:#e3efed;--orange:#c95a24;--orange-bg:#f8e7dc;--blue:#2a5d9f;--blue-bg:#e2ebf6;--purple:#6a4c93;--purple-bg:#ece4f5;--red:#b3261e;--red-bg:#f9e2e0;--ok:#2e7d32}
*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--ink);color:#f6f4ef;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top a{color:#c9d3dc;font-size:13px}.top b{font-size:16px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;max-width:1300px;margin:0 auto;padding:16px}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}
.tablet{background:#fff;border-radius:22px;border:10px solid #2b3540;min-height:640px;overflow:hidden;display:flex;flex-direction:column}
.thead{background:linear-gradient(90deg,#1f7a72,#2a5d9f);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}
.face{width:44px;height:44px;border-radius:50%;background:#10171f;display:flex;align-items:center;justify-content:center;gap:7px;flex:none}
.face i{width:9px;height:12px;border-radius:50%;background:#7fd3ff;display:block}
.thead .who{margin-left:auto;text-align:right;font-size:13px}
.screen{padding:18px;flex:1;overflow:auto}
h2{font-size:20px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 6px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.bigbtn{border:none;border-radius:16px;padding:22px 18px;text-align:left;cursor:pointer;color:#fff;font-weight:700;font-size:19px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
.bigbtn small{font-weight:400;font-size:13px;opacity:.9}
.b1{background:var(--orange)}.b2{background:var(--teal)}.b3{background:var(--blue)}.b4{background:var(--purple)}.b5{background:#7a5a1f}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.warn{background:var(--orange);border-color:var(--orange);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],select,textarea{border:1px solid #cdd3d8;border-radius:10px;padding:8px 11px;background:#fff;width:100%}
textarea{min-height:90px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute);flex:1;min-width:150px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}
.chip.y{background:#e3f1e4;color:var(--ok)}.chip.n{background:#eceeef;color:var(--mute);text-decoration:line-through}
.staff{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.staff button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;cursor:pointer}.staff button:hover{border-color:var(--teal)}
.note{padding:10px 13px;border-radius:10px;font-size:13px;margin:10px 0}.note.ok{background:#e3f1e4;color:var(--ok)}.note.err{background:var(--red-bg);color:var(--red)}.note.info{background:var(--blue-bg);color:#1e436f}.note.warn{background:var(--orange-bg);color:#7a3412}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.card.now{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-bg)}
.card .meta{font-size:12px;color:var(--mute)}
.log{background:#fff;border-radius:14px;border:1px solid var(--line);padding:12px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:12px}
.log h2{font-size:15px}.ent{border-top:1px solid var(--line);padding:8px 0;font-size:12px}
.ent b{font-family:monospace;font-size:12.5px}.ent pre{background:#1d2b3a;color:#e8eef2;padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;font-size:11.5px;margin:4px 0}
.okc{color:var(--ok)}.ngc{color:var(--red)}
details summary{cursor:pointer;font-size:13px;color:var(--blue)}
.back{background:none;border:none;color:var(--blue);cursor:pointer;padding:0;margin-bottom:8px;font-size:14px}
.q{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}.q label{border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top"><b>Kebbi操作デモ</b><span style="font-size:13px;color:#b9c4ce">Kebbi Care DB v3｜架空データ・このブラウザ内だけで動作</span><span style="flex:1"></span><a href="./">デモの説明</a><a href="./admin.html" target="_blank" rel="noopener">管理画面デモを開く</a></div>
<div class="wrap">
  <div class="tablet">
    <div class="thead"><div class="face"><i></i><i></i></div><div><b>Kebbi</b><div style="font-size:12px;opacity:.9" id="siteLbl"></div></div><div class="who" id="who"></div></div>
    <div class="screen" id="screen"></div>
  </div>
  <div class="log"><h2>通信ログ（Kebbi ⇄ Apps Script API）</h2><div style="font-size:12px;color:var(--mute)">Kebbiアプリが実際に送る内容と応答です。トークンは伏せて表示しています。</div><div id="log"></div></div>
</div>

<script src="sheets.js"></script>
<script src="gas-code.js"></script>
<script src="runtime.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var M=null, staff=null, opened=0, player={on:false};

// ---------- API呼び出し（ログ表示つき） ----------
function api(action,body){
  var r=KC3_DEMO.api(action,body);
  var req=JSON.parse(JSON.stringify(r.request));req.token=req.token.slice(0,8)+'…（伏せ字）';
  var ent=document.createElement('div');ent.className='ent';
  ent.innerHTML='<div><b>'+esc(action)+'</b> <span class="'+(r.response.ok?'okc':'ngc')+'">'+(r.response.ok?'ok':'error: '+esc(r.response.error.code))+'</span> <span style="color:var(--mute)">'+new Date().toLocaleTimeString('ja-JP')+'</span></div><details><summary>送信（POST JSON）</summary><pre>'+esc(JSON.stringify(req,null,1))+'</pre></details><details'+(r.response.ok?'':' open')+'><summary>応答</summary><pre>'+esc(JSON.stringify(r.response,null,1).slice(0,4000))+'</pre></details>';
  var log=$('#log');log.insertBefore(ent,log.firstChild);while(log.children.length>30)log.removeChild(log.lastChild);
  return r.response;
}
function loadMasters(){var r=api('masters.get',M?{since_version:M.masters_version}:{});if(r.ok&&!r.unchanged)M=r;$('#siteLbl').textContent=M?M.site.name+' 設置':''}
function can(p){return staff&&staff[p]}
function resOptions(sel){return '<option value="">（利用者を選ぶ）</option>'+M.residents.map(function(r){return '<option value="'+esc(r.resident_id)+'"'+(r.resident_id===sel?' selected':'')+'>'+esc(r.resident_id+' '+r.display_name+'（'+r.call_names.join('、')+'）')+'</option>'}).join('')}
function residentByCallName(s){
  var n=function(x){return String(x||'').replace(/[\s　・]/g,'').replace(/(さん|様|さま)$/,'')};var t=n(s);if(!t)return null;
  var hits=M.residents.filter(function(r){return r.call_names.concat([r.display_name,r.speech_name]).some(function(c){return c&&n(c)===t})});
  return hits.length===1?hits[0].resident_id:null;
}
function show(html){$('#screen').innerHTML=html;opened=Date.now()}
function note(id,kind,t){var el=$(id);if(el)el.innerHTML='<div class="note '+kind+'">'+t+'</div>'}
function perms(s){return [['can_input','入力'],['can_confirm','確定'],['can_view','閲覧'],['can_play','再生']].map(function(p){return '<span class="chip '+(s[p[0]]?'y':'n')+'">'+p[1]+'</span>'}).join('')}

// ---------- ログイン ----------
function login(){
  if(player.on)stopPlay();
  staff=null;$('#who').textContent='';
  loadMasters();
  var list=M.staff.filter(function(s){return s.site_id===M.site.site_id||s.role==='ヘルプ看護師'});
  show('<h2>職員ログイン</h2><p style="color:var(--mute);font-size:14px">実機では顔認証またはPINで職員を確定します。デモでは職員を選んでください。役割によってできる操作が変わります（マスタ登録シートの「権限（役割別）」）。</p><div class="staff">'+
    list.map(function(s){return '<button data-s="'+esc(s.staff_id)+'"><b>'+esc(s.display_name)+'</b> <span style="color:var(--mute);font-size:12px">'+esc(s.staff_id)+'</span><div style="font-size:13px">'+esc(s.role)+'</div><div>'+perms(s)+'</div></button>'}).join('')+'</div>');
  document.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){staff=M.staff.filter(function(s){return s.staff_id===b.dataset.s})[0];$('#who').innerHTML=esc(staff.display_name)+'（'+esc(staff.role)+'）<br><a href="#" id="lo" style="color:#fff">ログアウト</a>';$('#lo').onclick=function(e){e.preventDefault();login()};home()}});
}

// ---------- ホーム ----------
function home(){
  if(player.on)stopPlay();
  var pending=can('can_confirm')?(api('records.list',{status:'draft',staff_id:staff.staff_id}).total||0):0;
  show('<h2>ホーム</h2><div class="big">'+
    '<button class="bigbtn b1" id="go1">申し送りをする<small>録音 → 国産AIが要約・7項目 → 確認して保存</small></button>'+
    '<button class="bigbtn b2" id="go2">申し送りを受ける<small>まだ聞いていない申し送り・連絡事項を読み上げ</small></button>'+
    '<button class="bigbtn b3" id="go3">健康チェック<small>利用者を選んで設問に回答・途中保存も可</small></button>'+
    '<button class="bigbtn b4" id="go4">連絡<small>宛先を決めて連絡事項を残す</small></button>'+
    (can('can_confirm')?'<button class="bigbtn b5" id="go5">確定待ち（'+pending+'件）<small>確定権限のない職員が保存した記録を確定</small></button>':'')+
    '</div>'+(!can('can_input')?'<div class="note warn">この職員の役割では入力・確定ができません（聞くことはできます）。</div>':!can('can_confirm')?'<div class="note info">この職員の役割では確定ができません。保存した記録は「確定待ち」になり、確定担当が確定すると再生されます。</div>':''));
  $('#go1').onclick=handover;$('#go2').onclick=receive;$('#go3').onclick=health;$('#go4').onclick=notice;if($('#go5'))$('#go5').onclick=pendingList;
}
function backBtn(){return '<button class="back" id="bk">← ホームへ戻る</button>'}
function bindBack(){$('#bk').onclick=home}

// ---------- デモ用の簡易AI（実機では国産AIモデルが担当） ----------
var RULES=[['item_1',/(朝食|昼食|夕食|食事|食べ|摂取|エッセン|ミキサー|ソフト食|半分|割)/],['item_2',/(排泄|排便|排尿|便|尿|トイレ|おむつ|パッド|ハルン|コート|リハパン)/],['item_3',/(睡眠|眠|寝|覚醒|入眠)/],
  ['item_4',/(SpO2|BP|KT|BT|HR|血圧|体温|脈|酸素|バイタル|サチュ)/],['item_5',/(服薬|内服|薬|インスリン|点眼|軟膏)/],['item_6',/(穏やか|笑顔|不穏|機嫌|落ち着|イライラ|元気|表情|過ごし)/]];
function demoAI(text){
  var t=String(text||'').trim();
  // 単位（ど・かい・わり 等）や短い読みは普通の言葉の一部と区別できないため置換しない（数値＋単位は下の正規表現で処理）
  var pairs=[];M.terms.forEach(function(x){if(x.kind==='単位')return;x.readings.forEach(function(r){if(r&&x.display&&r.length>=3&&/^[ァ-ヶー]+$/.test(r)&&x.display.indexOf(r)!==0)pairs.push([r,x.display])})});
  pairs.sort(function(a,b){return b[0].length-a[0].length});
  pairs.forEach(function(p){t=t.split(p[0]).join(p[1])});
  t=t.replace(/(\d+)\s*パーセント/g,'$1%').replace(/(\d+)\s*ど(\d)/g,'$1.$2℃').replace(/([A-Za-z][A-Za-z0-9]*)(\d{2,})/g,function(all,w,d){return /^(SpO2|O2)$/.test(w.slice(0,4))?w.slice(0,4)+' '+w.slice(4)+d:all}).replace(/([A-Za-z])(\d)/g,'$1 $2').replace(/\s+/g,' ');
  t=t.replace(/SpO 2/g,'SpO2').replace(/O 2([^\d]|$)/g,'O2$1');
  // 利用者の特定（呼び名・表示名）
  var resident=null;
  M.residents.forEach(function(r){var names=r.call_names.concat([r.display_name+'さん',r.display_name+'様']);if(names.some(function(c){return c&&text.indexOf(c)>=0})){resident=resident===null||resident===r.resident_id?r.resident_id:'__multi'}});
  // 先頭の呼びかけ（「青木さん、」）を本文から除く
  if(resident&&resident!=='__multi'){var rr=M.residents.filter(function(r){return r.resident_id===resident})[0];rr.call_names.concat([rr.display_name+'さん',rr.display_name+'様']).forEach(function(c){t=t.replace(new RegExp('^'+c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[、,\\s]*'),'')})}
  var sentences=t.split(/[。\n]/).map(function(x){return x.trim()}).filter(String);
  var items={};
  sentences.forEach(function(sen){sen.split(/[、,]/).map(function(x){return x.trim()}).filter(String).forEach(function(c){
    var hit=false;RULES.forEach(function(r){if(!hit&&r[1].test(c)){items[r[0]]=(items[r[0]]?items[r[0]]+'、':'')+c;hit=true}});
    if(!hit)items.item_7=(items.item_7?items.item_7+'、':'')+c})});
  return {summary:sentences.join('。')+(sentences.length?'。':''),items:items,resident:resident==='__multi'?null:resident};
}

// ---------- 申し送りをする ----------
var SAMPLES=['青木さん、昼食は8割食べました。午後は穏やかに過ごしています。エスピーオーツー97パーセント。','井口さん、夜間は2回覚醒して、ピートイレを使いました。朝の内服は済んでいます。','上野さん、ビーピー132/80、ケーティー36ど8。少しイライラしていて、夕食は半分でした。'];
function handover(){
  var rid='h-'+Utilities.getUuid();
  show(backBtn()+'<h2>申し送りをする</h2>'+
    '<h3>① 話す（実機はKebbiのマイクで録音・音声認識）</h3><div class="row" style="margin-bottom:6px">'+SAMPLES.map(function(s,i){return '<button class="btn" data-sm="'+i+'">例'+(i+1)+'</button>'}).join('')+'</div><textarea id="src" placeholder="音声認識の結果（話した内容）"></textarea>'+
    '<div class="row" style="margin-top:8px"><button class="btn primary" id="ai">国産AIで要約・7項目（デモ）</button><span style="font-size:12px;color:var(--mute)">※デモでは用語登録を使った簡易処理です。実機は東大モデルが masters.get の ai_context を使って処理します。</span></div>'+
    '<details style="margin-top:6px"><summary>国産AIに渡す文脈（ai_context）を見る</summary><pre style="white-space:pre-wrap;font-size:12px;background:#f6f8f8;padding:8px;border-radius:8px;max-height:200px;overflow:auto">'+esc(M.ai_context)+'</pre></details>'+
    '<h3>② 確認する</h3><div class="row"><label class="f">利用者<select id="res">'+resOptions('')+'</select></label><label class="f">呼び名で探す<input type="text" id="call" placeholder="例：あおきさん"></label></div><div id="resMsg"></div>'+
    '<label class="f" style="margin-top:6px">AI要約<textarea id="sum"></textarea></label>'+
    '<div class="items" style="margin-top:6px">'+M.items.map(function(it){return '<label class="f">'+esc(it.label)+'<input type="text" data-it="'+it.key+'"></label>'}).join('')+'</div>'+
    '<label class="f" style="margin-top:6px">確定本文（Kebbiが読み上げる文。職員が確認・修正）<textarea id="conf"></textarea></label>'+
    '<h3>③ 保存する</h3><div class="row"><button class="btn" id="sDraft">途中保存</button><button class="btn warn" id="sConf"'+(can('can_confirm')?'':' disabled title="確定権限がありません"')+'>確定して保存</button></div><div id="out"></div>');
  bindBack();
  document.querySelectorAll('[data-sm]').forEach(function(b){b.onclick=function(){$('#src').value=SAMPLES[+b.dataset.sm]}});
  $('#call').oninput=function(){var id=residentByCallName($('#call').value);if(id){$('#res').value=id;note('#resMsg','ok','「'+esc($('#call').value)+'」→ '+esc(id))}else{$('#resMsg').innerHTML=$('#call').value?'<div class="note warn">1人に決まりません。一覧から選んでください。</div>':''}};
  $('#ai').onclick=function(){
    if(!$('#src').value.trim()){note('#out','err','話した内容を入力してください');return}
    var r=demoAI($('#src').value);$('#sum').value=r.summary;$('#conf').value=r.summary;
    document.querySelectorAll('[data-it]').forEach(function(i){i.value=r.items[i.dataset.it]||''});
    if(r.resident){$('#res').value=r.resident;note('#resMsg','ok','AIが利用者を特定：'+esc(r.resident))}else note('#resMsg','warn','利用者を1人に特定できません。一覧から選んでください（推測で割り当てない）。');
  };
  var saveH=function(status){
    var items={};document.querySelectorAll('[data-it]').forEach(function(i){items[i.dataset.it]=i.value});
    var r=api('records.save',{record:{record_id:rid,type:'handover',status:status,staff_id:staff.staff_id,resident_id:$('#res').value,source_text:$('#src').value,ai_summary:$('#sum').value,confirmed_text:status==='confirmed'?$('#conf').value:'',items:items,duration_sec:Math.round((Date.now()-opened)/1000),ai_model:'Weblab-MedLLM-gpt-oss-120b（デモ）'}});
    if(r.ok)note('#out','ok',(status==='confirmed'?'確定して保存しました。':'途中保存しました（確定待ち）。')+'版 '+r.revision+(r.unchanged?'（内容が同じため変更なし）':''));else note('#out','err',esc(r.error.message));
  };
  $('#sDraft').onclick=function(){saveH('draft')};$('#sConf').onclick=function(){saveH('confirmed')};
}

// ---------- 申し送りを受ける ----------
function receive(){
  var r=api('playback.list',{staff_id:staff.staff_id});
  if(!r.ok){show(backBtn()+'<div class="note err">'+esc(r.error.message)+'</div>');bindBack();return}
  var items=r.items;
  show(backBtn()+'<h2>申し送りを受ける</h2><p style="font-size:14px;color:var(--mute)">'+esc(staff.display_name)+'さんがまだ聞いていない、確定済みの申し送り・連絡事項（古い順）。最後まで読み上げた記録だけを「聞いた」として記録します。</p>'+
    '<div class="row" style="margin-bottom:10px"><button class="btn primary" id="play"'+(items.length?'':' disabled')+'>▶ 読み上げを始める</button><button class="btn" id="stop" disabled>■ 止める</button><label style="font-size:13px"><input type="checkbox" id="all"> 聞いた記録も表示</label></div><div id="pmsg"></div>'+
    (items.length?items.map(function(x,i){return '<div class="card" id="c'+i+'"><div class="meta">'+esc(x.recorded_at.slice(5,16).replace('T',' '))+'　'+esc(x.type_label)+'　'+esc(x.resident_id?x.resident_id+' '+x.resident_display_name:x.recipient||'')+'<span style="float:right" id="st'+i+'">'+(x.played_at?'聞いた':'')+'</span></div><div>'+esc(x.display_text)+'</div><details><summary>読み上げ文（speech）</summary><div style="font-size:13px">'+esc(x.speech)+'</div></details></div>'}).join(''):'<div class="note ok">新しい申し送り・連絡事項はありません。</div>'));
  bindBack();
  $('#all').onchange=function(){var rr=api('playback.list',{staff_id:staff.staff_id,unplayed:!$('#all').checked});items=rr.items||[];$('#play').disabled=!items.length;
    document.querySelectorAll('.card').forEach(function(c){c.remove()});$('#pmsg').insertAdjacentHTML('afterend',items.map(function(x,i){return '<div class="card" id="c'+i+'"><div class="meta">'+esc(x.recorded_at.slice(5,16).replace('T',' '))+'　'+esc(x.type_label)+'　'+esc(x.resident_id?x.resident_id+' '+x.resident_display_name:x.recipient||'')+'<span style="float:right" id="st'+i+'">'+(x.played_at?'聞いた':'')+'</span></div><div>'+esc(x.display_text)+'</div></div>'}).join(''))};
  $('#play').onclick=function(){startPlay(items)};$('#stop').onclick=stopPlay;
}
function startPlay(items){
  player={on:true,items:items,i:-1,done:0};$('#play').disabled=true;$('#stop').disabled=false;nextPlay();
}
function nextPlay(){
  if(!player.on)return;
  document.querySelectorAll('.card.now').forEach(function(c){c.classList.remove('now')});
  player.i++;var x=player.items[player.i];
  if(!x){player.on=false;$('#stop').disabled=true;note('#pmsg','ok','申し送りは以上です（'+player.done+'/'+player.items.length+' 件を聞いた記録にしました）');return}
  var card=$('#c'+player.i);if(card){card.classList.add('now');card.scrollIntoView({block:'nearest'})}
  var finished=function(ok){
    if(!player.on)return;
    if(ok){var r=api('playback.done',{record_id:x.record_id,revision:x.revision,staff_id:staff.staff_id});if(r.ok){player.done++;var st=$('#st'+player.i);if(st)st.textContent='聞いた'}}
    nextPlay();
  };
  var voices=('speechSynthesis' in window)?speechSynthesis.getVoices():[];
  var hasJa=voices.some(function(v){return /^ja/i.test(v.lang)});
  if('speechSynthesis' in window&&hasJa){
    var settled=false,done=function(ok){if(settled)return;settled=true;clearTimeout(guard);finished(ok)};
    // 完了通知が来ないときは未再生のまま次へ（実機の KebbiPlayback と同じ扱い）
    var guard=setTimeout(function(){try{speechSynthesis.cancel()}catch(e){}note('#pmsg','warn','読み上げが終わりませんでした。この記録は未再生のまま残します。');done(false)},15000+x.speech.length*300);
    var u=new SpeechSynthesisUtterance(x.speech);u.lang='ja-JP';u.rate=1.05;
    u.onend=function(){done(true)};u.onerror=function(e){if(e.error==='interrupted'||e.error==='canceled')return;note('#pmsg','warn','読み上げに失敗しました。この記録は未再生のまま残します。');done(false)};
    player.u=u;speechSynthesis.cancel();speechSynthesis.speak(u);
  } else { note('#pmsg','info','この端末には日本語の読み上げ音声がないため、画面表示だけで進めます（3秒ごと）。');setTimeout(function(){finished(true)},3000) }
}
function stopPlay(){
  player.on=false;try{speechSynthesis.cancel()}catch(e){}
  if($('#stop'))$('#stop').disabled=true;if($('#play'))$('#play').disabled=false;
  note('#pmsg','warn','止めました。読み上げ途中の記録は「未再生」のまま残ります（実機の KebbiPlayback と同じ動き）。');
}

// ---------- 健康チェック ----------
var QS=[['体調','良い','ふつう','悪い'],['痛み','なし','少し','強い'],['食欲','ある','ふつう','ない']];
function health(){
  var rid='k-'+Utilities.getUuid(),rev=null;
  show(backBtn()+'<h2>健康チェック</h2><label class="f">利用者<select id="res">'+resOptions('')+'</select></label><div id="prev"></div><div id="qs"></div>'+
    '<label class="f">メモ<textarea id="memo" style="min-height:60px"></textarea></label><div class="row" style="margin-top:8px"><button class="btn" id="sDraft">途中保存</button><button class="btn warn" id="sConf"'+(can('can_confirm')?'':' disabled')+'>確定して保存</button></div><div id="out"></div><p style="font-size:12px;color:var(--mute)">設問はジェネラス確定待ちのため仮のものです。回答は「設問：回答」の形で source_text に保存します。</p>');
  bindBack();
  var renderQ=function(ans){$('#qs').innerHTML=QS.map(function(q,i){return '<div><b>'+q[0]+'</b><div class="q">'+q.slice(1).map(function(a){return '<label><input type="radio" name="q'+i+'" value="'+a+'"'+(ans&&ans[q[0]]===a?' checked':'')+'> '+a+'</label>'}).join('')+'</div></div>'}).join('')};
  renderQ(null);
  $('#res').onchange=function(){
    rid='k-'+Utilities.getUuid();rev=null;$('#prev').innerHTML='';renderQ(null);$('#memo').value='';
    if(!$('#res').value)return;
    var last=api('records.last',{resident_id:$('#res').value,type:'health'});
    var conf=api('records.last',{resident_id:$('#res').value,type:'health',status:'confirmed'});
    var h='';
    if(conf.ok&&conf.record)h+='<div class="note info">前回の実施：'+esc(conf.record.recorded_at.slice(0,16).replace('T',' '))+'　'+esc(conf.record.confirmed_text)+'</div>';
    if(last.ok&&last.record&&last.record.status==='draft'){
      rid=last.record.record_id;rev=last.record.revision;var ans={};last.record.source_text.split('\n').forEach(function(l){var p=l.split('：');if(p.length===2)ans[p[0]]=p[1]});
      renderQ(ans);$('#memo').value=last.record.ai_summary;h+='<div class="note warn">途中保存があります。続きから入力しています（版 '+rev+'）。</div>';
    }
    $('#prev').innerHTML=h;
  };
  var saveK=function(status){
    var lines=QS.map(function(q,i){var c=document.querySelector('input[name=q'+i+']:checked');return q[0]+'：'+(c?c.value:'未回答')});
    var text=QS.map(function(q,i){var c=document.querySelector('input[name=q'+i+']:checked');return q[0]+(c?c.value:'未回答')}).join('。')+'。'+($('#memo').value?$('#memo').value:'');
    var body={record:{record_id:rid,type:'health',status:status,staff_id:staff.staff_id,resident_id:$('#res').value,source_text:lines.join('\n'),ai_summary:$('#memo').value,confirmed_text:status==='confirmed'?text:'',duration_sec:Math.round((Date.now()-opened)/1000)}};
    if(rev)body.base_revision=rev;
    var r=api('records.save',body);
    if(r.ok){rev=r.revision;note('#out','ok',(status==='confirmed'?'確定して保存しました。':'途中保存しました。あとで同じ利用者を選ぶと続きから入力できます。')+'（版 '+r.revision+'）')}else note('#out','err',esc(r.error.message));
  };
  $('#sDraft').onclick=function(){saveK('draft')};$('#sConf').onclick=function(){saveK('confirmed')};
}

// ---------- 連絡 ----------
function notice(){
  var rid='n-'+Utilities.getUuid();
  show(backBtn()+'<h2>連絡</h2><div class="row"><label class="f">宛先<select id="to"><option>日勤者</option><option>夜勤者</option><option>早出</option><option>看護師</option><option>全員</option></select></label><label class="f">関係する利用者（任意）<select id="res">'+resOptions('')+'</select></label></div>'+
    '<label class="f" style="margin-top:6px">連絡内容<textarea id="txt" placeholder="例：明日の朝、Pトイレを交換してください。"></textarea></label><div class="row" style="margin-top:8px"><button class="btn warn" id="sv">'+(can('can_confirm')?'確定して保存':'保存（確定待ち）')+'</button></div><div id="out"></div>');
  bindBack();
  $('#sv').onclick=function(){
    var st=can('can_confirm')?'confirmed':'draft';
    var r=api('records.save',{record:{record_id:rid,type:'notice',status:st,staff_id:staff.staff_id,resident_id:$('#res').value,ai_summary:$('#txt').value,confirmed_text:st==='confirmed'?$('#txt').value:'',recipient:$('#to').value}});
    if(r.ok)note('#out','ok',st==='confirmed'?'保存しました。「申し送りを受ける」で読み上げられます。':'確定待ちで保存しました。確定担当が確定すると読み上げられます。');else note('#out','err',esc(r.error.message));
  };
}

// ---------- 確定待ち ----------
function pendingList(){
  var r=api('records.list',{status:'draft',staff_id:staff.staff_id});
  var list=r.records||[];
  show(backBtn()+'<h2>確定待ち</h2><p style="font-size:14px;color:var(--mute)">確定すると、Kebbiで再生される対象になります。</p>'+(list.length?list.map(function(x,i){return '<div class="card"><div class="meta">'+esc(x.recorded_at.slice(5,16).replace('T',' '))+'　'+esc(x.type_label)+'　'+esc(x.resident_id||x.recipient||'')+'　記録：'+esc(x.staff_id)+'</div><textarea data-t="'+i+'">'+esc(x.confirmed_text||x.ai_summary)+'</textarea><div class="row" style="margin-top:6px"><button class="btn warn" data-c="'+i+'">確定する</button><span id="m'+i+'" style="font-size:13px"></span></div></div>'}).join(''):'<div class="note ok">確定待ちの記録はありません。</div>'));
  bindBack();
  document.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){var i=+b.dataset.c,x=list[i];
    var rr=api('records.confirm',{record_id:x.record_id,staff_id:staff.staff_id,confirmed_text:document.querySelector('[data-t="'+i+'"]').value,base_revision:x.revision});
    $('#m'+i).innerHTML=rr.ok?'<span class="okc">確定しました（版 '+rr.revision+'）</span>':'<span class="ngc">'+esc(rr.error.message)+'</span>';if(rr.ok)b.disabled=true}});
}

api('ping',{});
login();
})();
</script>
